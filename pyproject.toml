[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iwencai-client"
version = "0.1.0"
description = "A small Python client for the iWencai A-share OpenAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
dotenv = ["python-dotenv>=1.0"]
all = ["pandas>=2.1", "python-dotenv>=1.0"]

[tool.setuptools]
packages = ["iwencai_client"]
